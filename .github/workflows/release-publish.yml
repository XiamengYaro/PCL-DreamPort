name: Release publish

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration (Beta is published as prerelease)'
        required: true
        default: Beta
        type: choice
        options:
          - Release
          - Beta
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true
        type: string

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows_x64
            runner: windows-latest
            rid: win-x64
            platform: x64
          - target: windows_ARM64
            runner: windows-latest
            rid: win-arm64
            platform: ARM64
          - target: linux_x64
            runner: ubuntu-latest
            rid: linux-x64
            platform: x64
          - target: linux_ARM64
            runner: ubuntu-24.04-arm
            rid: linux-arm64
            platform: ARM64
          - target: macos_ARM64
            runner: macos-latest
            rid: osx-arm64
            platform: ARM64
          - target: macos_x64
            runner: macos-latest
            rid: osx-x64
            platform: x64

    uses: ./.github/workflows/reusable-build.yml
    with:
      configuration: ${{ inputs.configuration }}
      target: ${{ matrix.target }}
      rid: ${{ matrix.rid }}
      platform: ${{ matrix.platform }}
      runner: ${{ matrix.runner }}
      version: ${{ inputs.version }}
      ref: v${{ inputs.version }}
      include_secrets: true
    secrets: inherit

  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout all
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: v${{ inputs.version }}

      - name: Install git-cliff
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: git-cliff

      - name: Create local release tag
        run: git tag -f "v${{ inputs.version }}"

      - name: Generate changelog
        run: git-cliff --latest -o CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          tag_name: v${{ inputs.version }}
          name: PCL-梦港 v${{ inputs.version }}
          body_path: CHANGELOG.md
          prerelease: ${{ inputs.configuration == 'Beta' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish_assets:
    needs: [ build, changelog ]
    permissions:
      actions: read
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: PCL_DreamPort_${{ inputs.configuration }}_*
          path: ./release
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd release
          shopt -s nullglob
          files=(*.zip *.dmg *.AppImage *.deb *.rpm)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no release archives found for SHA256SUMS" >&2
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Sign release archives
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.rpm
          verify: true
          verify-cert-identity: https://github.com/${{ github.repository }}/.github/workflows/release-publish.yml@${{ github.ref }}
          verify-oidc-issuer: https://token.actions.githubusercontent.com

      - name: Upload archives and signatures to Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          tag_name: v${{ inputs.version }}
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish_draft:
    needs: [ publish_assets ]
    runs-on: ubuntu-latest
    steps:
      - name: Publish Draft
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ inputs.version }}
